[project]
name = "ariadne-sdk"
version = "0.1.0"
description = "Python SDK para agentes do Ariadne Runtime"
requires-python = ">=3.11"
dependencies = [
    "grpcio",
    "protobuf",
]

[project.optional-dependencies]
llm = ["openai==2.50.0", "pydantic==2.13.4"]

[project.scripts]
ariadne = "ariadne_sdk.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[dependency-groups]
dev = [
    "grpcio-tools",
]
