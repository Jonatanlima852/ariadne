name: ariadne-logistics-v2

x-agent: &agent
  depends_on:
    registry:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 60051), 2).close()"]
    interval: 2s
    timeout: 3s
    retries: 30
  environment: &agent-env
    AGENT_PORT: "60051"
    REGISTRY_ADDR: "registry:50051"
    HEARTBEAT_INTERVAL_SECONDS: "1"

x-llm-env: &llm-env
  <<: *agent-env
  LLM_MODEL: "${LLM_MODEL:-gpt-5.6-luna}"
  LOGISTICS_V2_DEMO: "${LOGISTICS_V2_DEMO:-0}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"

services:
  registry:
    build:
      context: ../../../../..
      dockerfile: runtime/services/registry/Dockerfile
    ports:
      - "127.0.0.1:${LOGISTICS_V2_REGISTRY_PORT:-55051}:50051"
    environment:
      REGISTRY_ADDR: ":50051"
      FAILURE_SCAN_INTERVAL: "1s"
      SUSPECTED_TIMEOUT: "10s"
      DEAD_TIMEOUT: "20s"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50051"]
      interval: 2s
      timeout: 2s
      retries: 30

  orchestrator:
    build:
      context: ../../../../..
      dockerfile: runtime/services/orchestrator/Dockerfile
    ports:
      - "127.0.0.1:${LOGISTICS_V2_ORCHESTRATOR_PORT:-55052}:50052"
    environment:
      ORCHESTRATOR_ADDR: ":50052"
      REGISTRY_ADDR: "registry:50051"
      EXECUTION_TIMEOUT: "120s"
      EVENTS_PATH: "/data/events.jsonl"
    volumes:
      - events_data:/data
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50052"]
      interval: 2s
      timeout: 2s
      retries: 30

  order-interpreter:
    <<: *agent
    build:
      context: ../../../../..
      dockerfile: studies/scenarios/logistics/v2/agents/order_interpreter/Dockerfile
    environment:
      <<: *llm-env
      AGENT_HOST: "order-interpreter"

  mission-decomposer:
    <<: *agent
    build:
      context: ../../../../..
      dockerfile: studies/scenarios/logistics/v2/agents/mission_decomposer/Dockerfile
    environment:
      <<: *llm-env
      AGENT_HOST: "mission-decomposer"

  incident-analyst:
    <<: *agent
    build:
      context: ../../../../..
      dockerfile: studies/scenarios/logistics/v2/agents/incident_analyst/Dockerfile
    environment:
      <<: *llm-env
      AGENT_HOST: "incident-analyst"

  operations-reporter:
    <<: *agent
    build:
      context: ../../../../..
      dockerfile: studies/scenarios/logistics/v2/agents/operations_reporter/Dockerfile
    environment:
      <<: *llm-env
      AGENT_HOST: "operations-reporter"

  inventory-manager:
    <<: *agent
    build:
      context: ../../../../..
      dockerfile: studies/scenarios/logistics/v2/agents/inventory_manager/Dockerfile
    environment:
      <<: *agent-env
      AGENT_HOST: "inventory-manager"

  resource-allocator:
    <<: *agent
    build:
      context: ../../../../..
      dockerfile: studies/scenarios/logistics/v2/agents/resource_allocator/Dockerfile
    environment:
      <<: *agent-env
      AGENT_HOST: "resource-allocator"

  route-planner:
    <<: *agent
    build:
      context: ../../../../..
      dockerfile: studies/scenarios/logistics/v2/agents/route_planner/Dockerfile
    environment:
      <<: *agent-env
