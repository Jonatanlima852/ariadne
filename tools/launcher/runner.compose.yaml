services:
  runner:
    build:
      context: "${ARIADNE_ROOT:?execute pelo comando ./ariadne}"
      dockerfile: tools/launcher/Dockerfile
    image: ariadne-scenario-runner:local
    profiles: [ariadne-tools]
    environment:
      REGISTRY_ADDR: registry:50051
      ORCHESTRATOR_ADDR: orchestrator:50052
      MESSAGING_ADDR: messaging:50053
      SCENARIO_REPORT_PATH: /results/result.json
      ARIADNE_READY_TIMEOUT: "${ARIADNE_READY_TIMEOUT:-90}"
      ARIADNE_SCENARIO_TIMEOUT: "${ARIADNE_SCENARIO_TIMEOUT:-180}"
    volumes:
      - type: bind
        source: "${ARIADNE_RUN_DIR:?execute pelo comando ./ariadne}"
        target: /results
