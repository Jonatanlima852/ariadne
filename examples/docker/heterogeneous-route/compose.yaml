name: tg-heterogeneous-route

services:
  registry:
    build:
      context: ../../..
      dockerfile: runtime/services/registry/Dockerfile
    ports:
      - "${REGISTRY_PORT:-50051}:50051"
    environment:
      REGISTRY_ADDR: ":50051"
      FAILURE_SCAN_INTERVAL: "1s"
      SUSPECTED_TIMEOUT: "10s"
      DEAD_TIMEOUT: "20s"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50051"]
      interval: 2s
      timeout: 2s
      retries: 15

  orchestrator:
    build:
      context: ../../..
      dockerfile: runtime/services/orchestrator/Dockerfile
    ports:
      - "${ORCHESTRATOR_PORT:-50052}:50052"
    environment:
      ORCHESTRATOR_ADDR: ":50052"
      REGISTRY_ADDR: "registry:50051"
      EVENTS_PATH: "/data/events.jsonl"
    volumes:
      - events_data:/data
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50052"]
      interval: 2s
      timeout: 2s
      retries: 15

  llm-agent:
    build:
      context: ../../..
      dockerfile: examples/support/agents/llm-agent/Dockerfile
    ports:
      - "${LLM_AGENT_PORT:-60056}:60056"
    environment:
      AGENT_ID: "llm-agent-01"
      AGENT_HOST: "llm-agent"
      AGENT_PORT: "60056"
      REGISTRY_ADDR: "registry:50051"
      HEARTBEAT_INTERVAL_SECONDS: "5"
      LLM_MODEL: "${LLM_MODEL:-gpt-5.6-luna}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?set OPENAI_API_KEY in the env file}"
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 60056), 2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20

  bdi-agent:
    build:
      context: ../../..
      dockerfile: examples/support/agents/bdi-agent/Dockerfile
    ports:
      - "${BDI_AGENT_PORT:-60054}:60054"
    environment:
      AGENT_ID: "bdi-agent-01"
      AGENT_HOST: "bdi-agent"
      AGENT_PORT: "60054"
      REGISTRY_ADDR: "registry:50051"
      HEARTBEAT_INTERVAL_SECONDS: "5"
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 60054), 2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  events_data:
