name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: sdk/python/.python-version
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: tools/inspector/.nvmrc
      - run: python -m pip install uv==0.11.14
      - run: make verify
