name: ariadne-workflow-sequential

services:
  registry:
    build:
      context: ../../..
      dockerfile: runtime/services/registry/Dockerfile
    ports:
      - "${REGISTRY_PORT:-53051}:50051"
    environment:
      REGISTRY_ADDR: ":50051"
      FAILURE_SCAN_INTERVAL: "1s"
      SUSPECTED_TIMEOUT: "10s"
      DEAD_TIMEOUT: "20s"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50051"]
      interval: 2s
      timeout: 2s
      retries: 15

  orchestrator:
    build:
      context: ../../..
      dockerfile: runtime/services/orchestrator/Dockerfile
    ports:
      - "${ORCHESTRATOR_PORT:-53052}:50052"
    environment:
      ORCHESTRATOR_ADDR: ":50052"
      REGISTRY_ADDR: "registry:50051"
      EXECUTION_TIMEOUT: "5s"
      EVENTS_PATH: "/data/events.jsonl"
    volumes:
      - events_data:/data
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50052"]
      interval: 2s
      timeout: 2s
      retries: 15

  echo-agent:
    build:
      context: ../../..
      dockerfile: examples/support/agents/echo-agent/Dockerfile
    environment:
      AGENT_ID: "workflow-echo"
      AGENT_HOST: "echo-agent"
      AGENT_PORT: "60052"
      REGISTRY_ADDR: "registry:50051"
      CAPABILITY: "echo"
      HEARTBEAT_INTERVAL_SECONDS: "5"
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 60052), 2).close()"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  events_data:
