name: ariadne-failure-reassignment-benchmark

x-mock: &mock
  build:
    context: ../../../..
    dockerfile: studies/scenarios/failure_reassignment/agents/Dockerfile
  depends_on:
    registry:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 60051), 2).close()"]
    interval: 2s
    timeout: 2s
    retries: 20

services:
  registry:
    build:
      context: ../../../..
      dockerfile: runtime/services/registry/Dockerfile
    environment:
      REGISTRY_ADDR: ":50051"
      FAILURE_SCAN_INTERVAL: "1s"
      SUSPECTED_TIMEOUT: "10s"
      DEAD_TIMEOUT: "20s"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50051"]
      interval: 2s
      timeout: 2s
      retries: 20

  orchestrator:
    build:
      context: ../../../..
      dockerfile: runtime/services/orchestrator/Dockerfile
    ports:
      - "${BENCHMARK_ORCHESTRATOR_PORT:-54052}:50052"
    environment:
      ORCHESTRATOR_ADDR: ":50052"
      REGISTRY_ADDR: "registry:50051"
      EXECUTION_TIMEOUT: "10s"
      EVENTS_PATH: "/data/events.jsonl"
    volumes:
      - events_data:/data
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50052"]
      interval: 2s
      timeout: 2s
      retries: 20

  a-slow:
    <<: *mock
    environment:
      AGENT_ID: "a-slow"
      AGENT_HOST: "a-slow"
      AGENT_PORT: "60051"
      REGISTRY_ADDR: "registry:50051"
      CAPABILITY: "benchmark-recovery"
      DELAY_MS: "1000"
      FAIL_RATE: "0"
      HEARTBEAT_INTERVAL_SECONDS: "1"

  b-healthy:
    <<: *mock
    environment:
      AGENT_ID: "b-healthy"
      AGENT_HOST: "b-healthy"
      AGENT_PORT: "60051"
      REGISTRY_ADDR: "registry:50051"
      CAPABILITY: "benchmark-recovery"
      DELAY_MS: "20"
      FAIL_RATE: "0"
      HEARTBEAT_INTERVAL_SECONDS: "1"


volumes:
  events_data:
