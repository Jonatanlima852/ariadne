services:

  registry:
    build:
      context: ../..
      dockerfile: runtime/services/registry/Dockerfile
    ports:
      - "50051:50051"
    environment:
      REGISTRY_ADDR: ":50051"
      FAILURE_SCAN_INTERVAL: "1s"
      SUSPECTED_TIMEOUT: "10s"
      DEAD_TIMEOUT: "20s"

  orchestrator:
    build:
      context: ../..
      dockerfile: runtime/services/orchestrator/Dockerfile
    ports:
      - "50052:50052"
    environment:
      ORCHESTRATOR_ADDR: ":50052"
      REGISTRY_ADDR: "registry:50051"
      EVENTS_PATH: "/data/events.jsonl"
    volumes:
      - events_data:/data
    depends_on:
      - registry

  messaging:
    build:
      context: ../..
      dockerfile: runtime/services/messaging/Dockerfile
    ports:
      - "50053:50053"
    environment:
      MESSAGING_ADDR: ":50053"
      EVENTS_PATH: "/data/message-events.jsonl"
    volumes:
      - events_data:/data

  execution-simulator:
    build:
      context: ../..
      dockerfile: studies/scenarios/basic_task/agents/execution_simulator/Dockerfile
    ports:
      - "60051:60051"
    environment:
      AGENT_ID: "execution-simulator-01"
      AGENT_HOST: "execution-simulator"
      AGENT_PORT: "60051"
      REGISTRY_ADDR: "registry:50051"
      CAPABILITY: "echo"
      DELAY_MS: "100"
      FAIL_RATE: "0.0"
      HEARTBEAT_INTERVAL_SECONDS: "5"
    depends_on:
      - registry

  client-runner:
    profiles:
      - client
    build:
      context: ../..
      dockerfile: tools/clients/submit-task/Dockerfile
    environment:
      ORCHESTRATOR_ADDR: "orchestrator:50052"
      ARIADNE_SDK_PATH: "/sdk"
    depends_on:
      - orchestrator
    command: ["--goal", "Teste ponta a ponta", "--capability", "echo"]

  planner-explainer:
    profiles:
      - llm
      - heterogeneous
    build:
      context: ../..
      dockerfile: studies/scenarios/routing/agents/planner_explainer/Dockerfile
    ports:
      - "60056:60056"
    environment:
      AGENT_ID: "planner-explainer-01"
      AGENT_HOST: "planner-explainer"
      AGENT_PORT: "60056"
      REGISTRY_ADDR: "registry:50051"
      HEARTBEAT_INTERVAL_SECONDS: "5"
      LLM_MODEL: "${LLM_MODEL:-gpt-5.6-luna}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      - registry

  route-planner:
    profiles:
      - heterogeneous
    build:
      context: ../..
      dockerfile: studies/scenarios/routing/agents/route_planner/Dockerfile
    ports:
      - "60054:60054"
    environment:
      AGENT_ID: "route-planner-01"
      AGENT_HOST: "route-planner"
      AGENT_PORT: "60054"
      REGISTRY_ADDR: "registry:50051"
      CAPABILITY: "route-planning"
      HEARTBEAT_INTERVAL_SECONDS: "5"
    depends_on:
      - registry

volumes:
  events_data:
