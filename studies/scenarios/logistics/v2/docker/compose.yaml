  energy-manager:
    <<: *agent
    build:
      context: ../../../../..
      dockerfile: studies/scenarios/logistics/v2/agents/energy_manager/Dockerfile
    environment:
      <<: *agent-env
      AGENT_HOST: "energy-manager"

  constraint-supervisor:
    <<: *agent
    build:
      context: ../../../../..
      dockerfile: studies/scenarios/logistics/v2/agents/constraint_supervisor/Dockerfile
    environment:
      <<: *agent-env
      AGENT_HOST: "constraint-supervisor"

  mission-executor:
    <<: *agent
    build:
      context: ../../../../..
      dockerfile: studies/scenarios/logistics/v2/agents/mission_executor/Dockerfile
    environment:
      <<: *agent-env
      AGENT_HOST: "mission-executor"

  single-llm:
    <<: *agent
    build:
      context: ../../../../..
      dockerfile: studies/scenarios/logistics/v2/agents/single_llm/Dockerfile
    environment:
      <<: *llm-env
      AGENT_HOST: "single-llm"

  mission-coordinator:
    <<: *agent
    build:
      context: ../../../../..
      dockerfile: studies/scenarios/logistics/v2/agents/mission_coordinator/Dockerfile
    environment:
