syntax = "proto3";

// Ariadne Runtime Contract 2.0.0 — frozen for the undergraduate thesis evaluation.
// Compatible additions must preserve existing field numbers and semantics.

package contract.v1;

option go_package = "ariadne/runtime/gen/go/contract/v1;contractv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ─────────────────────────────────────────────
// TraceContext
// Carregado em todo task e evento para rastreabilidade.
// ─────────────────────────────────────────────

message TraceContext {
  string trace_id       = 1;
  string span_id        = 2;
  string parent_span_id = 3;
  string correlation_id = 4;
}

// ─────────────────────────────────────────────
// ErrorInfo
// Erros padronizados retornados por qualquer serviço.
// ─────────────────────────────────────────────

enum ErrorCode {
  ERROR_CODE_UNKNOWN                     = 0;
  ERROR_CODE_INVALID_TASK                = 1;
  ERROR_CODE_CAPABILITY_NOT_FOUND        = 2;
  ERROR_CODE_AGENT_UNAVAILABLE           = 3;
  ERROR_CODE_TIMEOUT                     = 4;
  ERROR_CODE_EXECUTION_FAILED            = 5;
  ERROR_CODE_CONTRACT_VERSION_UNSUPPORTED = 6;
  ERROR_CODE_MESSAGE_DELIVERY_FAILED     = 7;
}

message ErrorInfo {
  ErrorCode code    = 1;
  string    message = 2;
  bool      retryable = 3;
  string    details   = 4;
}

// ─────────────────────────────────────────────
// Capability
// Algo que um agente sabe fazer.
// ─────────────────────────────────────────────

message Capability {
  string capability_id  = 1;
  string name           = 2;
  string description    = 3;
  repeated string tags  = 4;
  string cost_hint      = 5;
  int64  latency_hint_ms = 6;
  google.protobuf.Struct metadata = 7;
}

// ─────────────────────────────────────────────
// AgentDescriptor
// Representa um agente registrado no runtime.
// ─────────────────────────────────────────────

enum AgentStatus {
  AGENT_STATUS_UNKNOWN  = 0;
  AGENT_STATUS_ALIVE    = 1;
  AGENT_STATUS_BUSY     = 2;
  AGENT_STATUS_SUSPECTED = 3;
  AGENT_STATUS_DEAD     = 4;
  AGENT_STATUS_DRAINING = 5;
}

message AgentEndpoint {
  string protocol = 1; // "grpc"
  string address  = 2; // "host:port"
}

// Família de raciocínio declarada pelo agente. Informativa: o runtime não
// a usa para selecionar agentes; serve para evidência e apresentação.
enum AgentKind {
  AGENT_KIND_UNKNOWN       = 0;
  AGENT_KIND_DETERMINISTIC = 1;
  AGENT_KIND_BDI           = 2;
  AGENT_KIND_LLM           = 3;
  AGENT_KIND_HYBRID        = 4;
}

message AgentDescriptor {
  string   agent_id         = 1;
  string   name             = 2;
  string   runtime          = 3;
  string   contract_version = 4;
  repeated Capability capabilities = 5;
  AgentEndpoint endpoint   = 6;
  AgentStatus   status     = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  google.protobuf.Struct    metadata   = 10;
  int32                     current_task_count = 11;
  double                    load               = 12;
  AgentKind                 kind               = 13;
}

// ─────────────────────────────────────────────
// HealthStatus
// Estado de saúde reportado por um agente.
// ─────────────────────────────────────────────

message HealthStatus {
  string    agent_id            = 1;
  AgentStatus status            = 2;
  google.protobuf.Timestamp timestamp          = 3;
  google.protobuf.Timestamp last_heartbeat_at  = 4;
  int32     current_task_count  = 5;
  double    load                = 6;
  string    details             = 7;
}

// ─────────────────────────────────────────────
// Task
// Unidade de trabalho submetida ao orquestrador.
// ─────────────────────────────────────────────

enum TaskStatus {
  TASK_STATUS_UNKNOWN    = 0;
  TASK_STATUS_CREATED    = 1;
  TASK_STATUS_QUEUED     = 2;
  TASK_STATUS_ASSIGNED   = 3;
  TASK_STATUS_RUNNING    = 4;
  TASK_STATUS_WAITING    = 5;
  TASK_STATUS_COMPLETED  = 6;
  TASK_STATUS_FAILED     = 7;
  TASK_STATUS_CANCELLED  = 8;
  TASK_STATUS_REASSIGNED = 9;
  TASK_STATUS_TIMEOUT    = 10;
}

enum SelectionPolicy {
  SELECTION_POLICY_FIRST_AVAILABLE = 0;
  SELECTION_POLICY_ROUND_ROBIN     = 1;
  SELECTION_POLICY_LEAST_LOADED    = 2;
  SELECTION_POLICY_RANDOM          = 3;
}

message RetryPolicy {
  int32 max_attempts      = 1;
  int64 backoff_ms        = 2;
  bool  exclude_failed_agent = 3;
}

message BdiCycle {
  int32 cycle                     = 1;
  repeated string beliefs_added   = 2;
  repeated string beliefs_removed = 3;
  string goal                     = 4;
  string selected_plan            = 5;
  string action                   = 6; // passo executado neste ciclo
  string outcome                  = 7; // "continue" | "achieved" | "failed" | "no_applicable_plan"
}

message BdiTrace {
  repeated BdiCycle cycles = 1;
  int32 cycle_count        = 2;
  string final_status      = 3; // "achieved" | "no_applicable_plan" | "cycle_limit" | "failed"
}

message BdiExtension {
  string goal           = 1;
  string beliefs        = 2;
  string selected_plan  = 3;
  string intention_id   = 4;
  string reasoning_summary = 5;
  BdiTrace trace        = 6;
  repeated string goals = 7;
}

message LlmExtension {
  string provider           = 1;
  string model              = 2;
  string prompt             = 3;
  string system_instruction = 4;
  double temperature        = 5;
  int32  max_tokens         = 6;
  double confidence         = 7;
  string explanation        = 8;
  string reasoning_summary  = 9;
}

message Task {
  string     task_id      = 1;
  string     type         = 2;
  string     goal         = 3;
  google.protobuf.Struct payload = 4;
  repeated string required_capabilities = 5;
  TaskStatus status       = 6;
  TraceContext trace      = 7;
  google.protobuf.Timestamp created_at = 8;

  // campos opcionais
  int32            priority          = 9;
  int64            deadline_ms       = 10;
  string           parent_task_id    = 11;
  string           assigned_agent_id = 12;
  int32            attempt           = 13;
  RetryPolicy      retry_policy      = 14;
  SelectionPolicy  selection_policy  = 15;
  BdiExtension     bdi               = 16;
  LlmExtension     llm               = 17;
  google.protobuf.Struct metadata    = 18;
}

// ─────────────────────────────────────────────
// TaskResult
// Resultado retornado pelo agente após executar a task.
// ─────────────────────────────────────────────

// Uma tentativa de execução registrada pelo orquestrador: quem recebeu a
// tarefa, quando foi despachada e devolvida, e como terminou.
enum AttemptOutcome {
  ATTEMPT_OUTCOME_UNKNOWN   = 0;
  ATTEMPT_OUTCOME_COMPLETED = 1;
  ATTEMPT_OUTCOME_FAILED    = 2;
  ATTEMPT_OUTCOME_TIMEOUT   = 3;
}

message TaskAttempt {
  int32     attempt      = 1;
  string    agent_id     = 2;
  AgentKind agent_kind   = 3;
  google.protobuf.Timestamp started_at   = 4; // despacho pelo orquestrador
  google.protobuf.Timestamp completed_at = 5; // resposta recebida pelo orquestrador
  AttemptOutcome outcome = 6;
  ErrorInfo error        = 7;
}

message TaskResult {
  string     task_id     = 1;
  string     agent_id    = 2;
  TaskStatus status      = 3;
  google.protobuf.Timestamp completed_at = 4;
  TraceContext trace     = 5;

  // campos opcionais
  google.protobuf.Struct output     = 6;
  ErrorInfo              error      = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Struct metadata   = 9;
  BdiExtension           bdi        = 10;
  LlmExtension           llm        = 11;
  // Preenchidos pelo orquestrador: todas as tentativas desta tarefa, em
  // ordem, e a família do agente que produziu o resultado final.
  repeated TaskAttempt   attempts   = 12;
  AgentKind              agent_kind = 13;
}

// ─────────────────────────────────────────────
// TaskEvent
// Evento emitido durante o ciclo de vida de uma task.
// Essencial para benchmarks e observabilidade.
// ─────────────────────────────────────────────

enum TaskEventType {
  TASK_EVENT_TYPE_UNKNOWN      = 0;
  TASK_EVENT_TYPE_CREATED      = 1;
  TASK_EVENT_TYPE_QUEUED       = 2;
  TASK_EVENT_TYPE_ASSIGNED     = 3;
  TASK_EVENT_TYPE_STARTED      = 4;
  TASK_EVENT_TYPE_COMPLETED    = 5;
  TASK_EVENT_TYPE_FAILED       = 6;
  TASK_EVENT_TYPE_TIMEOUT      = 7;
  TASK_EVENT_TYPE_REASSIGNED   = 8;
  TASK_EVENT_TYPE_AGENT_SELECTED = 9;
  TASK_EVENT_TYPE_MESSAGE_SENT     = 10;
  TASK_EVENT_TYPE_MESSAGE_RECEIVED = 11;
  TASK_EVENT_TYPE_MISSION_CREATED         = 12;
  TASK_EVENT_TYPE_MISSION_PLANNED         = 13;
  TASK_EVENT_TYPE_MISSION_ROUND_STARTED   = 14;
  TASK_EVENT_TYPE_MISSION_ROUND_COMPLETED = 15;
  TASK_EVENT_TYPE_MISSION_COMPLETED       = 16;
  TASK_EVENT_TYPE_MISSION_FAILED          = 17;
  TASK_EVENT_TYPE_MISSION_ABORTED         = 18;
  TASK_EVENT_TYPE_MISSION_CANCELLED       = 19;
  TASK_EVENT_TYPE_MISSION_TIMEOUT         = 20;
}

message TaskEvent {
  string        event_id  = 1;
  string        task_id   = 2;
  TaskEventType type      = 3;
  google.protobuf.Timestamp timestamp = 4;
  TraceContext  trace     = 5;

  // campos opcionais
  string agent_id = 6;
  string details  = 7;
}

// ─────────────────────────────────────────────
// MessageEnvelope
// Comunicação entre agentes via messaging service.
// ─────────────────────────────────────────────

enum MessageType {
  MESSAGE_TYPE_UNKNOWN   = 0;
  MESSAGE_TYPE_REQUEST   = 1;
  MESSAGE_TYPE_RESPONSE  = 2;
  MESSAGE_TYPE_INFORM    = 3;
  MESSAGE_TYPE_ERROR     = 4;
  MESSAGE_TYPE_HEARTBEAT = 5;
  MESSAGE_TYPE_PROPOSE   = 6;
  MESSAGE_TYPE_ACCEPT    = 7;
  MESSAGE_TYPE_REJECT    = 8;
}

message MessageEnvelope {
  string      message_id      = 1;
  string      conversation_id = 2;
  string      correlation_id  = 3;
  string      sender_id       = 4;
  string      receiver_id     = 5;
  MessageType type            = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Timestamp timestamp = 8;
  TraceContext trace          = 9;

  // campos opcionais
  string reply_to   = 10;
  int64  ttl_ms     = 11;
  string task_id    = 12;
  google.protobuf.Struct metadata = 13;
}

message MessageAck {
  string message_id = 1;
  bool accepted      = 2;
  ErrorInfo error    = 3;
}

message PublishMessageRequest { MessageEnvelope message = 1; }
message PublishMessageResponse { MessageAck ack = 1; }
message StreamMessagesRequest { string receiver_id = 1; }

service MessagingService {
  rpc PublishMessage (PublishMessageRequest) returns (PublishMessageResponse);
  rpc StreamMessages (StreamMessagesRequest) returns (stream MessageEnvelope);
}

// ─────────────────────────────────────────────
// RegistryService
// Responsável por registrar e descobrir agentes.
// ─────────────────────────────────────────────

message RegisterAgentRequest {
  AgentDescriptor agent = 1;
}

message RegisterAgentResponse {
  bool   success  = 1;
  string message  = 2;
}

message UnregisterAgentRequest {
  string agent_id = 1;
}

message UnregisterAgentResponse {
  bool   success  = 1;
}

message GetAgentRequest {
  string agent_id = 1;
}

message GetAgentResponse {
  AgentDescriptor agent = 1;
}

message DiscoverAgentsRequest {
  repeated string required_capabilities = 1;
  AgentStatus     status_filter         = 2;
}

message DiscoverAgentsResponse {
  repeated AgentDescriptor agents = 1;
}

message ReportHealthRequest {
  HealthStatus health = 1;
}

message ReportHealthResponse {
  bool success = 1;
}

service RegistryService {
  rpc RegisterAgent   (RegisterAgentRequest)   returns (RegisterAgentResponse);
  rpc UnregisterAgent (UnregisterAgentRequest) returns (UnregisterAgentResponse);
  rpc GetAgent        (GetAgentRequest)        returns (GetAgentResponse);
  rpc DiscoverAgents  (DiscoverAgentsRequest)  returns (DiscoverAgentsResponse);
  rpc ReportHealth    (ReportHealthRequest)    returns (ReportHealthResponse);
}

// ─────────────────────────────────────────────
// OrchestratorService
// Recebe tasks de clientes e as distribui para agentes.
// ─────────────────────────────────────────────

message SubmitTaskRequest {
  Task task = 1;
}

message SubmitTaskResponse {
  TaskResult     result          = 1;
  ErrorInfo      error           = 2;
  WorkflowResult workflow_result = 3;
}

// ─────────────────────────────────────────────
// Workflow contract
// O planner descreve trabalho; o runtime valida e controla a execução.
// ─────────────────────────────────────────────

enum WorkflowStatus {
  WORKFLOW_STATUS_UNKNOWN    = 0;
  WORKFLOW_STATUS_CREATED    = 1;
  WORKFLOW_STATUS_PLANNING   = 2;
  WORKFLOW_STATUS_VALIDATING = 3;
  WORKFLOW_STATUS_RUNNING    = 4;
  WORKFLOW_STATUS_COMPLETED  = 5;
  WORKFLOW_STATUS_FAILED     = 6;
  WORKFLOW_STATUS_CANCELLED  = 7;
  WORKFLOW_STATUS_TIMEOUT    = 8;
}

enum WorkflowStepStatus {
  WORKFLOW_STEP_STATUS_UNKNOWN   = 0;
  WORKFLOW_STEP_STATUS_PENDING   = 1;
  WORKFLOW_STEP_STATUS_READY     = 2;
  WORKFLOW_STEP_STATUS_RUNNING   = 3;
  WORKFLOW_STEP_STATUS_COMPLETED = 4;
  WORKFLOW_STEP_STATUS_FAILED    = 5;
  WORKFLOW_STEP_STATUS_SKIPPED   = 6;
  WORKFLOW_STEP_STATUS_CANCELLED = 7;
}

message ResultBinding {
  string source_step_id = 1;
  string source_path    = 2;
  string target_field   = 3;
}

message WorkflowStep {
  string step_id                  = 1;
  Task task_template              = 2;
  repeated string depends_on      = 3;
  repeated ResultBinding input_bindings = 4;
}

message WorkflowDefinition {
  string workflow_id           = 1;
  repeated WorkflowStep steps  = 2;
  string final_step_id         = 3;
}

message SubmitWorkflowRequest {
  Task root_task                 = 1;
  WorkflowDefinition workflow   = 2;
}

message WorkflowStepResult {
  string step_id             = 1;
  WorkflowStepStatus status  = 2;
  TaskResult result          = 3;
  Task task                  = 4; // tarefa materializada enviada ao agente (payload já resolvido pelos bindings)
}

message WorkflowResult {
  string workflow_id                  = 1;
  string run_id                       = 2;
  string root_task_id                 = 3;
  WorkflowStatus status               = 4;
  repeated WorkflowStepResult step_results = 5;
  google.protobuf.Struct output       = 6;
  ErrorInfo error                     = 7;
  TraceContext trace                  = 8;
  google.protobuf.Timestamp created_at   = 9;
  google.protobuf.Timestamp completed_at = 10;
}

message SubmitWorkflowResponse {
  WorkflowResult result = 1;
  ErrorInfo error        = 2;
}

message StartWorkflowRequest {
  Task root_task               = 1;
  WorkflowDefinition workflow = 2;
}

message StartWorkflowResponse {
  string run_id   = 1;
  ErrorInfo error = 2;
}

message GetWorkflowRequest { string run_id = 1; }
message GetWorkflowResponse {
  WorkflowResult result = 1;
  ErrorInfo error        = 2;
}

message CancelWorkflowRequest { string run_id = 1; }
message CancelWorkflowResponse {
  WorkflowResult result = 1;
  ErrorInfo error        = 2;
}

// ─────────────────────────────────────────────
// Mission contract
// O cliente entrega um objetivo amplo; um agente planejador o decompõe em
// rodadas de workflow e o runtime coordena até DONE, ABORT ou limite.
// ─────────────────────────────────────────────

enum MissionStatus {
  MISSION_STATUS_UNKNOWN   = 0;
  MISSION_STATUS_CREATED   = 1;
  MISSION_STATUS_PLANNING  = 2;
  MISSION_STATUS_RUNNING   = 3;
  MISSION_STATUS_COMPLETED = 4;
  MISSION_STATUS_FAILED    = 5;
  MISSION_STATUS_ABORTED   = 6;
  MISSION_STATUS_CANCELLED = 7;
  MISSION_STATUS_TIMEOUT   = 8;
}

message MissionLimits {
  int32 max_rounds          = 1; // padrão 10
  int32 max_parallel        = 2; // padrão 4, vira EngineOptions.Parallelism
  int64 round_deadline_ms   = 3; // padrão 30000, timeout total do workflow da rodada
  int64 planner_deadline_ms = 4; // padrão 120000, deadline da tarefa ao planejador
  int64 mission_deadline_ms = 5; // padrão 0 = sem limite
}

message MissionRequest {
  string mission_id                        = 1; // gerado se vazio
  string goal                              = 2; // texto livre
  google.protobuf.Struct context           = 3; // estado inicial da missão
  string planner_capability                = 4; // padrão "mission-planning"
  MissionLimits limits                     = 5;
  RetryPolicy default_retry_policy         = 6; // aplicada a passos sem política própria
  SelectionPolicy default_selection_policy = 7;
  TraceContext trace                       = 8;
  google.protobuf.Struct metadata          = 9;
}

enum PlannerAction {
  PLANNER_ACTION_UNKNOWN = 0;
  PLANNER_ACTION_PLAN    = 1;
  PLANNER_ACTION_DONE    = 2;
  PLANNER_ACTION_ABORT   = 3;
}

message MissionRound {
  int32 round                            = 1;
  string planner_agent_id                = 2;
  PlannerAction action                   = 3;
  WorkflowDefinition plan                = 4; // vazio em DONE/ABORT
  WorkflowResult result                  = 5; // vazio em DONE/ABORT
  google.protobuf.Struct context_after   = 6;
  google.protobuf.Timestamp started_at   = 7;
  google.protobuf.Timestamp completed_at = 8;
  string planner_summary                 = 9;
  TaskResult planner_result              = 10;
  Task planner_task                      = 11; // tarefa enviada ao planejador; payload é o PlannerRequest
}

message MissionResult {
  string mission_id                      = 1;
  MissionStatus status                   = 2;
  google.protobuf.Struct output          = 3; // saída declarada em DONE
  google.protobuf.Struct context         = 4; // contexto final
  repeated MissionRound rounds           = 5;
  ErrorInfo error                        = 6;
  TraceContext trace                     = 7;
  google.protobuf.Timestamp created_at   = 8;
  google.protobuf.Timestamp completed_at = 9;
  string root_task_id                    = 10;
}

message RunMissionRequest     { MissionRequest mission = 1; }
message RunMissionResponse    { MissionResult result = 1; ErrorInfo error = 2; }
message StartMissionRequest   { MissionRequest mission = 1; }
message StartMissionResponse  { string mission_id = 1; ErrorInfo error = 2; }
message GetMissionRequest     { string mission_id = 1; }
message GetMissionResponse    { MissionResult result = 1; ErrorInfo error = 2; }
message CancelMissionRequest  { string mission_id = 1; }
message CancelMissionResponse { MissionResult result = 1; ErrorInfo error = 2; }

// ─────────────────────────────────────────────
// Planner protocol
// Payload estruturado trocado entre orquestrador e planejador como uma
// tarefa comum (Task.type = "MISSION_PLANNING"). Serializado em JSON com
// nomes de campo em snake_case (protojson com UseProtoNames).
// ─────────────────────────────────────────────

message CapabilitySummary {
  string capability_id = 1;
  string name          = 2;
  string description   = 3;
  int32  agent_count   = 4; // agentes vivos que a oferecem
}

message RoundSummary {
  int32 round                              = 1;
  PlannerAction action                     = 2;
  repeated WorkflowStepResult step_results = 3; // inclui falhas e agent_id
  WorkflowStatus status                    = 4;
  string planner_summary                   = 5;
}

message PlannerRequest {
  string mission_id                                 = 1;
  string goal                                       = 2;
  int32 round                                       = 3;
  google.protobuf.Struct context                    = 4;
  repeated RoundSummary history                     = 5;
  repeated CapabilitySummary available_capabilities = 6;
  MissionLimits limits                              = 7;
}

message PlannerResponse {
  PlannerAction action                  = 1;
  WorkflowDefinition plan               = 2; // obrigatório em PLAN
  google.protobuf.Struct output         = 3; // obrigatório em DONE
  google.protobuf.Struct context_update = 4; // mesclado no contexto antes de executar
  string summary                        = 5; // uma frase sobre a decisão
  string reason                         = 6; // obrigatório em ABORT
}

service OrchestratorService {
  rpc SubmitTask (SubmitTaskRequest) returns (SubmitTaskResponse);
  rpc SubmitWorkflow (SubmitWorkflowRequest) returns (SubmitWorkflowResponse);
  rpc StartWorkflow (StartWorkflowRequest) returns (StartWorkflowResponse);
  rpc GetWorkflow (GetWorkflowRequest) returns (GetWorkflowResponse);
  rpc CancelWorkflow (CancelWorkflowRequest) returns (CancelWorkflowResponse);
  rpc RunMission (RunMissionRequest) returns (RunMissionResponse);
  rpc StartMission (StartMissionRequest) returns (StartMissionResponse);
  rpc GetMission (GetMissionRequest) returns (GetMissionResponse);
  rpc CancelMission (CancelMissionRequest) returns (CancelMissionResponse);
}

// ─────────────────────────────────────────────
// AgentService
// Implementado por cada agente. O orquestrador chama este serviço.
// ─────────────────────────────────────────────

message ExecuteTaskRequest {
  Task task = 1;
}

message ExecuteTaskResponse {
  TaskResult result = 1;
}

service AgentService {
  rpc ExecuteTask (ExecuteTaskRequest) returns (ExecuteTaskResponse);
}
