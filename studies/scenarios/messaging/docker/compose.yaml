name: ariadne-messaging-basic

services:
  messaging:
    build:
      context: ../../../..
      dockerfile: runtime/services/messaging/Dockerfile
    ports:
      - "${MESSAGING_PORT:-55053}:50053"
    environment:
      MESSAGING_ADDR: ":50053"
      EVENTS_PATH: "/data/message-events.jsonl"
    volumes:
      - events_data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50053"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  events_data:
