name: ariadne-logistics

services:
  registry:
    build:
      context: ../../../..
      dockerfile: runtime/services/registry/Dockerfile
    environment:
      REGISTRY_ADDR: ":50051"
      FAILURE_SCAN_INTERVAL: "1s"
      SUSPECTED_TIMEOUT: "10s"
      DEAD_TIMEOUT: "20s"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50051"]
      interval: 2s
      timeout: 2s
      retries: 20

  orchestrator:
    build:
      context: ../../../..
      dockerfile: runtime/services/orchestrator/Dockerfile
    ports:
      - "${BENCHMARK_ORCHESTRATOR_PORT:-54052}:50052"
    environment:
      ORCHESTRATOR_ADDR: ":50052"
      REGISTRY_ADDR: "registry:50051"
      EXECUTION_TIMEOUT: "10s"
      EVENTS_PATH: "/data/events.jsonl"
    volumes:
      - events_data:/data
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50052"]
      interval: 2s
      timeout: 2s
      retries: 20

  route-planner:
    build:
      context: ../../../..
      dockerfile: studies/agents/route-planner/Dockerfile
    environment:
      AGENT_ID: "route-planner-01"
      AGENT_HOST: "route-planner"
      AGENT_PORT: "60054"
      REGISTRY_ADDR: "registry:50051"
      HEARTBEAT_INTERVAL_SECONDS: "1"
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 60054), 2).close()"]
      interval: 2s
      timeout: 2s
      retries: 20

  planner-explainer:
    build:
      context: ../../../..
      dockerfile: studies/agents/planner-explainer/Dockerfile
    environment:
      AGENT_ID: "planner-explainer-01"
      AGENT_HOST: "planner-explainer"
      AGENT_PORT: "60056"
      REGISTRY_ADDR: "registry:50051"
      HEARTBEAT_INTERVAL_SECONDS: "1"
      LLM_MODEL: "${LLM_MODEL:-gpt-5.6-luna}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}"
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 60056), 2).close()"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  events_data:
